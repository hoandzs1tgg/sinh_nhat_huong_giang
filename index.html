<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Sinh nhật Hương Giang — Dải ngân hà điều ước ✨</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Pacifico&family=Playfair+Display:wght@700;900&family=Dancing+Script:wght@600;700&family=Be+Vietnam+Pro:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --pink: #ff4fa3;
        --rose: #ff2d8a;
        --violet: #7a3cff;
        --gold: #ffd36b;
        --ice: #9fd4ff;
        --mint: #00e0b0;
        --ink: #fff4fa;
        --script: "Dancing Script", "Segoe Script", cursive;
        --serif: "Playfair Display", "Times New Roman", Georgia, serif;
        --sans: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #060216;
        color: var(--ink);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      .aur {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        background: radial-gradient(ellipse at 50% 118%, #3b0a5c, #060216 62%);
      }
      .aur i {
        position: absolute;
        width: 60vmax;
        height: 60vmax;
        border-radius: 50%;
        filter: blur(80px);
        opacity: 0.42;
        animation: dr 18s ease-in-out infinite alternate;
      }
      .aur i:nth-child(1) {
        background: #ff3d9a;
        left: -20vmax;
        top: -20vmax;
      }
      .aur i:nth-child(2) {
        background: #3d7bff;
        right: -25vmax;
        top: 10vmax;
        animation-delay: -6s;
      }
      .aur i:nth-child(3) {
        background: #00e0b0;
        left: 15vmax;
        bottom: -38vmax;
        opacity: 0.28;
        animation-delay: -11s;
      }
      @keyframes dr {
        to {
          transform: translate(12vmax, 8vmax) scale(1.2);
        }
      }
      canvas {
        position: fixed;
        inset: 0;
        z-index: 1;
        width: 100%;
        height: 100%;
        touch-action: manipulation;
      }
      .veil {
        position: fixed;
        inset: 0;
        z-index: 2;
        pointer-events: none;
        background:
          radial-gradient(
            130% 90% at 50% -10%,
            rgba(6, 2, 22, 0.55),
            transparent 45%
          ),
          linear-gradient(
            180deg,
            rgba(6, 2, 22, 0.6),
            transparent 22%,
            transparent 68%,
            rgba(6, 2, 22, 0.82)
          );
      }
      .frame {
        position: fixed;
        inset: 13px;
        z-index: 3;
        border-radius: 22px;
        border: 1px solid rgba(255, 211, 107, 0.16);
        box-shadow: inset 0 0 70px rgba(255, 79, 163, 0.07);
        pointer-events: none;
        animation: fadeIn 2s ease 0.1s both;
      }
      .frame i {
        position: absolute;
        width: 26px;
        height: 26px;
        border: 1px solid rgba(255, 211, 107, 0.45);
      }
      .frame i:nth-child(1) {
        top: -1px;
        left: -1px;
        border-right: 0;
        border-bottom: 0;
        border-radius: 22px 0 0 0;
      }
      .frame i:nth-child(2) {
        top: -1px;
        right: -1px;
        border-left: 0;
        border-bottom: 0;
        border-radius: 0 22px 0 0;
      }
      .frame i:nth-child(3) {
        bottom: -1px;
        left: -1px;
        border-right: 0;
        border-top: 0;
        border-radius: 0 0 0 22px;
      }
      .frame i:nth-child(4) {
        bottom: -1px;
        right: -1px;
        border-left: 0;
        border-top: 0;
        border-radius: 0 0 22px 0;
      }
      #topbar {
        position: fixed;
        top: calc(26px + env(safe-area-inset-top, 0px));
        left: 0;
        right: 0;
        z-index: 5;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.55rem;
        text-align: center;
        pointer-events: none;
        padding: 0 18px;
        animation: rise 1.2s ease 0.15s both;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.36rem 1rem;
        border-radius: 99px;
        border: 1px solid rgba(255, 211, 107, 0.35);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        font-size: 0.66rem;
        font-weight: 500;
        letter-spacing: 0.26em;
        text-transform: uppercase;
        color: #ffe9b8;
        box-shadow:
          0 0 26px rgba(255, 211, 107, 0.16),
          inset 0 0 18px rgba(255, 211, 107, 0.08);
      }
      .pill .dot {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--gold);
        box-shadow: 0 0 10px var(--gold);
      }
      .eyebrow {
        font-size: 0.66rem;
        font-weight: 300;
        letter-spacing: 0.4em;
        text-transform: uppercase;
        color: rgba(255, 244, 250, 0.6);
        white-space: nowrap;
      }
      #hero {
        position: fixed;
        top: calc(96px + env(safe-area-inset-top, 0px));
        left: 0;
        right: 0;
        z-index: 5;
        text-align: center;
        padding: 0 18px;
        pointer-events: none;
        animation: rise 1.4s ease 0.4s both;
      }
      .kicker {
        font-family: var(--script);
        font-weight: 600;
        font-size: clamp(1.15rem, 4.6vw, 1.6rem);
        color: var(--ice);
        margin: 0 0 0.05rem;
        opacity: 0.92;
        text-shadow: 0 0 22px rgba(159, 212, 255, 0.55);
      }
      #cap {
        font-family: var(--serif);
        font-weight: 900;
        font-size: clamp(2.1rem, 9.5vw, 4.2rem);
        line-height: 1.08;
        letter-spacing: 0.01em;
        margin: 0;
        background: linear-gradient(
          100deg,
          #fff6e0,
          #ffd36b 26%,
          #ff9ec8 52%,
          #9fd4ff 76%,
          #fff6e0
        );
        background-size: 220% 100%;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: sh 8s linear infinite;
        filter: drop-shadow(0 8px 30px rgba(255, 79, 163, 0.35));
      }
      @keyframes sh {
        to {
          background-position: 220% 0;
        }
      }
      .sub {
        margin: 0.55rem auto 0;
        max-width: 330px;
        font-size: 0.76rem;
        font-weight: 300;
        line-height: 1.65;
        color: rgba(255, 244, 250, 0.72);
        text-shadow: 0 2px 12px rgba(6, 2, 22, 0.85);
      }
      #toast {
        position: fixed;
        left: 50%;
        bottom: calc(23% + env(safe-area-inset-bottom, 0px));
        transform: translate(-50%, 20px);
        width: min(86vw, 450px);
        z-index: 6;
        text-align: center;
        padding: 16px 20px 15px;
        border-radius: 18px;
        background: linear-gradient(
          160deg,
          rgba(255, 255, 255, 0.14),
          rgba(255, 255, 255, 0.05)
        );
        border: 1px solid rgba(255, 211, 107, 0.35);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        box-shadow:
          0 18px 50px rgba(0, 0, 0, 0.45),
          0 0 40px rgba(255, 79, 163, 0.32),
          inset 0 0 30px rgba(255, 255, 255, 0.06);
        font-size: clamp(0.95rem, 3.7vw, 1.1rem);
        font-weight: 500;
        line-height: 1.65;
        opacity: 0;
        transition: 0.6s cubic-bezier(0.2, 1.2, 0.3, 1);
        pointer-events: none;
      }
      #toast::before {
        content: "✦ ✦ ✦";
        display: block;
        font-size: 0.56rem;
        letter-spacing: 0.4em;
        color: var(--gold);
        margin-bottom: 0.4rem;
        opacity: 0.9;
      }
      #toast.on {
        opacity: 1;
        transform: translate(-50%, 0);
      }
      #hold {
        --p: 0;
        position: fixed;
        left: 50%;
        bottom: calc(8vh + env(safe-area-inset-bottom, 0px));
        transform: translateX(-50%);
        z-index: 6;
        width: 112px;
        height: 112px;
        border: 0;
        border-radius: 50%;
        color: #fff;
        cursor: pointer;
        background: conic-gradient(
          from -90deg,
          var(--gold) calc(var(--p) * 1%),
          rgba(255, 255, 255, 0.14) 0
        );
        box-shadow:
          0 0 0 1px rgba(255, 255, 255, 0.12),
          0 0 44px rgba(255, 79, 163, 0.42),
          0 18px 50px rgba(0, 0, 0, 0.5);
        user-select: none;
        -webkit-user-select: none;
        touch-action: none;
        font-family: inherit;
        animation: riseHold 1.2s ease 0.9s both;
      }
      #hold::before {
        content: "";
        position: absolute;
        inset: -15px;
        border-radius: 50%;
        border: 1px solid rgba(255, 211, 107, 0.22);
        animation: halo 3.4s ease-in-out infinite;
        pointer-events: none;
      }
      #hold::after {
        content: "";
        position: absolute;
        inset: 7px;
        border-radius: 50%;
        background: radial-gradient(circle at 32% 26%, #ff7ac0, #a33bff 46%, #4b1e8f);
        box-shadow: inset 0 0 28px rgba(255, 255, 255, 0.16);
      }
      #hold b {
        position: relative;
        z-index: 1;
        font-size: 0.86rem;
        font-weight: 600;
        line-height: 1.3;
        letter-spacing: 0.02em;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.45);
      }
      #hold.full {
        animation: pu 0.55s infinite alternate;
      }
      @keyframes halo {
        0%,
        100% {
          transform: scale(0.95);
          opacity: 0.4;
        }
        50% {
          transform: scale(1.07);
          opacity: 0.95;
        }
      }
      @keyframes pu {
        to {
          transform: translateX(-50%) scale(1.1);
        }
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes riseHold {
        from {
          opacity: 0;
          transform: translateX(-50%) translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateX(-50%) translateY(0);
        }
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @media (max-width: 520px) {
        #hero {
          top: calc(88px + env(safe-area-inset-top, 0px));
        }
        #toast {
          bottom: calc(22.5% + env(safe-area-inset-bottom, 0px));
        }
        #hold {
          width: 104px;
          height: 104px;
        }
      }
      @media (max-height: 620px) {
        .sub {
          display: none;
        }
        #hero {
          top: calc(74px + env(safe-area-inset-top, 0px));
        }
      }
    </style>
  </head>
  <body>
    <div class="aur"><i></i><i></i><i></i></div>
    <canvas id="c"></canvas>
    <div class="veil"></div>
    <div class="frame"><i></i><i></i><i></i><i></i></div>
    <div id="topbar">
      <span class="pill"><span class="dot"></span>28 · 10<span class="dot"></span></span>
      <span class="eyebrow">Dành riêng cho Hương Giang</span>
    </div>
    <div id="hero">
      <p class="kicker">Chúc mừng sinh nhật</p>
      <h1 id="cap">Hương Giang ✨</h1>
      <p class="sub">
        Một dải ngân hà điều ước — nơi mỗi vì sao là một lời chúc dành riêng cho
        bạn.
      </p>
    </div>
    <div id="toast"></div>
    <button id="hold">
      <b>Giữ để<br />ước ✨</b>
    </button>
    <script>
      const $ = (i) => document.getElementById(i),
        cv = $("c"),
        g = cv.getContext("2d"),
        R = Math.random,
        TAU = Math.PI * 2;
      let W,
        H,
        T = 0,
        mx = -999,
        my = -999,
        phase = 0,
        ch = 0,
        holding = false;
      const off = document.createElement("canvas"),
        og = off.getContext("2d", { willReadFrequently: true });
      const N = innerWidth < 700 ? 1900 : 3100;
      const words = [
        "28/10",
        "HAPPY|BIRTHDAY",
        "HƯƠNG GIANG",
        "♥",
        "CHÚC MỪNG|SINH NHẬT",
        "HƯƠNG GIANG",
        "♥",
      ];
      const HUES = [322, 288, 205, 45, 168];
      const SPR = HUES.map((h) => {
        const sp = document.createElement("canvas"),
          d = 26;
        sp.width = sp.height = d;
        const c = sp.getContext("2d"),
          gr = c.createRadialGradient(d / 2, d / 2, 0, d / 2, d / 2, d / 2);
        gr.addColorStop(0, "rgba(255,255,255,1)");
        gr.addColorStop(0.22, `hsla(${h},100%,82%,1)`);
        gr.addColorStop(0.5, `hsla(${h},96%,66%,.75)`);
        gr.addColorStop(1, `hsla(${h},96%,60%,0)`);
        c.fillStyle = gr;
        c.fillRect(0, 0, d, d);
        return sp;
      });
      const P = Array.from({ length: N }, () => ({
        x: R() * innerWidth,
        y: R() * innerHeight,
        vx: 0,
        vy: 0,
        tx: 0,
        ty: 0,
        hi: (R() * HUES.length) | 0,
        s: 0.9 + R() * 1.4,
        ph: R() * TAU,
      }));
      const stars = Array.from({ length: 150 }, () => ({
        x: R(),
        y: R(),
        z: 0.3 + R() * 0.7,
        p: R() * 6,
      }));
      let sh = [],
        rk = [],
        fx = [],
        waves = [],
        flashes = [];
      function rs() {
        const D = Math.min(devicePixelRatio || 1, 2);
        W = innerWidth;
        H = innerHeight;
        cv.width = W * D;
        cv.height = H * D;
        g.setTransform(D, 0, 0, D, 0, 0);
        off.width = W;
        off.height = H;
        setPhase(phase);
      }
      function pts(txt) {
        const o = [];
        if (txt === "♥") {
          const k = Math.min(W * 0.4, H * 0.22) / 16;
          for (let i = 0; i < N * 1.3; i++) {
            const t = R() * TAU,
              r = Math.sqrt(R());
            o.push([
              W / 2 + 16 * Math.pow(Math.sin(t), 3) * k * r,
              H * 0.46 -
                (13 * Math.cos(t) -
                  5 * Math.cos(2 * t) -
                  2 * Math.cos(3 * t) -
                  Math.cos(4 * t)) *
                  k *
                  r,
            ]);
          }
          return o;
        }
        og.clearRect(0, 0, W, H);
        const lines = txt.split("|");
        og.font = '900 100px "Segoe UI",Arial,sans-serif';
        let maxW = 0;
        for (const ln of lines) maxW = Math.max(maxW, og.measureText(ln).width);
        const fsW = (100 * W * 0.9) / maxW,
          fsH = (H * 0.29) / (lines.length * 1.14),
          fs = Math.min(fsW, fsH, H * 0.21);
        og.font = `900 ${fs}px "Segoe UI",Arial,sans-serif`;
        og.textAlign = "center";
        og.textBaseline = "middle";
        const lh = fs * 1.14,
          startY = H * 0.44 - ((lines.length - 1) * lh) / 2;
        lines.forEach((ln, i) => og.fillText(ln, W / 2, startY + i * lh));
        const d = og.getImageData(0, 0, W, H).data,
          gap = 2;
        for (let y = 0; y < H; y += gap)
          for (let x = 0; x < W; x += gap)
            if (d[(y * W + x) * 4 + 3] > 128) o.push([x, y]);
        return o;
      }
      function setPhase(i) {
        const q = pts(words[i]);
        for (const p of P) {
          const t = q[(R() * q.length) | 0] || [W / 2, H / 2];
          p.tx = t[0] + (R() - 0.5) * 1.1;
          p.ty = t[1] + (R() - 0.5) * 1.1;
        }
      }
      function shock(x, y, f = 1) {
        for (const p of P) {
          const dx = p.x - x,
            dy = p.y - y,
            d = Math.hypot(dx, dy) + 1;
          if (d < 240) {
            const k = ((240 - d) / 240) * 20 * f;
            p.vx += (dx / d) * k;
            p.vy += (dy / d) * k;
          }
        }
      }
      // fireworks
      function launch(x, type) {
        rk.push({
          sx: W / 2 + (R() - 0.5) * 80,
          x: 0,
          y: H,
          tx: x,
          ty: H * (0.13 + R() * 0.31),
          t: 0,
          h: R() * 360,
          type: type || null,
        });
      }
      const FT = [
        "peony",
        "ring",
        "willow",
        "double",
        "chrys",
        "glitter",
        "crossette",
        "heart",
      ];
      function explode(x, y, h, forced) {
        const type = forced || FT[(R() * FT.length) | 0];
        const add = (vx, vy, hue, l, size, grav, drag, split) =>
          fx.push({
            x,
            y,
            px: x,
            py: y,
            vx,
            vy,
            l,
            h: hue,
            s: size,
            g: grav,
            d: drag,
            split: !!split,
          });
        if (type === "ring" || type === "double") {
          const rings = type === "double" ? 2 : 1;
          for (let r = 0; r < rings; r++) {
            const n = 82,
              sp = 2.5 + r * 1.15;
            for (let i = 0; i < n; i++) {
              const a = (i / n) * TAU + R() * 0.05;
              add(
                Math.cos(a) * sp,
                Math.sin(a) * sp,
                h + r * 62,
                1,
                1.9,
                0.03,
                0.985,
              );
            }
          }
        } else if (type === "willow") {
          for (let i = 0; i < 95; i++) {
            const a = R() * TAU,
              v = 0.7 + R() * 2.5;
            add(Math.cos(a) * v, Math.sin(a) * v, 42 + R() * 28, 1, 1.7, 0.078, 0.992);
          }
        } else if (type === "heart") {
          const n = 125,
            k = 0.82;
          for (let i = 0; i < n; i++) {
            const t = (i / n) * TAU;
            add(
              16 * Math.pow(Math.sin(t), 3) * k,
              -(
                13 * Math.cos(t) -
                5 * Math.cos(2 * t) -
                2 * Math.cos(3 * t) -
                Math.cos(4 * t)
              ) * k,
              335 + R() * 22,
              1,
              2,
              0.028,
              0.985,
            );
          }
        } else if (type === "chrys") {
          for (let i = 0; i < 125; i++) {
            const a = R() * TAU,
              v = 0.6 + R() * 3.5;
            add(
              Math.cos(a) * v,
              Math.sin(a) * v,
              h + R() * 44 - 22,
              1,
              1.8,
              0.045,
              0.988,
            );
          }
        } else if (type === "crossette") {
          for (let i = 0; i < 16; i++) {
            const a = R() * TAU,
              v = 1 + R() * 2.2;
            add(
              Math.cos(a) * v,
              Math.sin(a) * v,
              h + R() * 40 - 20,
              1,
              2.4,
              0.03,
              0.985,
              true,
            );
          }
        } else if (type === "glitter") {
          for (let i = 0; i < 90; i++) {
            const a = R() * TAU,
              v = 0.3 + R() * 1.9;
            add(
              Math.cos(a) * v,
              Math.sin(a) * v,
              h + R() * 70,
              1.15,
              1.25,
              0.018,
              0.995,
            );
          }
        } else {
          for (let i = 0; i < 115; i++) {
            const a = R() * TAU,
              v = 0.6 + R() * 4.2;
            add(
              Math.cos(a) * v,
              Math.sin(a) * v,
              h + R() * 34 - 17,
              1,
              1.8,
              0.038,
              0.986,
            );
          }
        }
        waves.push({ x, y, r: 6, l: 0.95, h });
        flashes.push({ x, y, l: 1 });
        shock(x, y, 0.2);
      }
      const wishes = [
        "Chúc Giang một tuổi mới thật nhiều niềm vui và hạnh phúc 💖",
        "Mong mọi điều Giang ước đều thành sự thật 💫",
        "Sức khoẻ dồi dào, bình an mỗi ngày 🍀",
        "Thật nhiều niềm vui và những người thương bên cạnh 💖",
        "Gặp nhiều may mắn, làm gì cũng thành công 🚀",
        "Cười thật nhiều nhé, nụ cười của bạn đáng giá lắm 😊",
      ];
      let tt;
      function fire() {
        const n = 2 + Math.floor(ch * 6);
        for (let i = 0; i < n; i++)
          setTimeout(() => launch(W * (0.16 + R() * 0.68)), i * 170);
        setTimeout(() => {
          for (let k = 0; k < 4; k++)
            setTimeout(
              () => launch(W * (0.24 + R() * 0.52), "heart"),
              k * 120,
            );
        }, n * 170 + 350);
        for (const p of P) {
          p.vx += (R() - 0.5) * (10 + ch * 30);
          p.vy += (R() - 0.5) * (10 + ch * 30);
        }
        const t = $("toast");
        t.textContent = wishes[(R() * wishes.length) | 0];
        t.classList.add("on");
        clearTimeout(tt);
        tt = setTimeout(() => t.classList.remove("on"), 4800);
        ch = 0;
      }
      const hb = $("hold");
      hb.addEventListener("pointerdown", (e) => {
        holding = true;
        hb.setPointerCapture(e.pointerId);
        e.preventDefault();
      });
      const up = () => {
        if (!holding) return;
        holding = false;
        if (ch < 0.12) ch = 0.12;
        fire();
        hb.classList.remove("full");
      };
      hb.addEventListener("pointerup", up);
      hb.addEventListener("pointercancel", up);
      addEventListener("pointermove", (e) => {
        mx = e.clientX;
        my = e.clientY;
      });
      cv.addEventListener("pointerdown", (e) => {
        mx = e.clientX;
        my = e.clientY;
        shock(mx, my);
        for (let i = 0; i < 24; i++) {
          const a = R() * TAU,
            v = 1 + R() * 3;
          fx.push({
            x: mx,
            y: my,
            px: mx,
            py: my,
            vx: Math.cos(a) * v,
            vy: Math.sin(a) * v,
            l: 0.8,
            h: R() * 360,
          });
        }
      });
      addEventListener("pointerleave", () => {
        mx = my = -999;
      });
      addEventListener("resize", rs);
      setInterval(() => {
        phase = (phase + 1) % words.length;
        setPhase(phase);
      }, 4200);
      setInterval(() => {
        if (holding) return;
        launch(W * (0.15 + R() * 0.7));
        if (R() < 0.35)
          setTimeout(() => launch(W * (0.15 + R() * 0.7)), 240);
      }, 3000);
      function frame() {
        T += 0.016;
        g.clearRect(0, 0, W, H);
        g.globalCompositeOperation = "source-over";
        const ox = mx > 0 ? (mx - W / 2) * 0.02 : 0,
          oy = my > 0 ? (my - H / 2) * 0.02 : 0;
        for (const s of stars) {
          g.fillStyle = `rgba(255,255,255,${s.z * (0.3 + 0.7 * Math.abs(Math.sin(T * 1.5 * s.z + s.p)))})`;
          g.fillRect(
            (((s.x * W - ox * s.z * 3) % W) + W) % W,
            s.y * H - oy * s.z * 3,
            s.z * 2,
            s.z * 2,
          );
        }
        if (R() < 0.012)
          sh.push({
            x: R() * W,
            y: R() * H * 0.4,
            vx: -6 - R() * 5,
            vy: 3 + R() * 3,
            l: 1,
          });
        for (const s of sh) {
          s.x += s.vx;
          s.y += s.vy;
          s.l -= 0.02;
          const gr = g.createLinearGradient(
            s.x,
            s.y,
            s.x - s.vx * 8,
            s.y - s.vy * 8,
          );
          gr.addColorStop(0, `rgba(255,255,255,${s.l})`);
          gr.addColorStop(1, "rgba(255,255,255,0)");
          g.strokeStyle = gr;
          g.lineWidth = 2;
          g.beginPath();
          g.moveTo(s.x, s.y);
          g.lineTo(s.x - s.vx * 8, s.y - s.vy * 8);
          g.stroke();
        }
        sh = sh.filter((s) => s.l > 0);
        const gl = g.createRadialGradient(
          W / 2,
          H * 0.42,
          0,
          W / 2,
          H * 0.42,
          Math.min(W, H) * 0.5,
        );
        gl.addColorStop(0, "rgba(255,90,170,.16)");
        gl.addColorStop(1, "rgba(255,90,170,0)");
        g.fillStyle = gl;
        g.fillRect(0, 0, W, H);
        g.globalCompositeOperation = "lighter";
        for (const p of P) {
          p.vx += (p.tx - p.x) * 0.015;
          p.vy += (p.ty - p.y) * 0.015;
          const dx = p.x - mx,
            dy = p.y - my,
            d2 = dx * dx + dy * dy;
          if (d2 < 14000) {
            const d = Math.sqrt(d2) + 0.1,
              f = ((14000 - d2) / 14000) * 3;
            p.vx += (dx / d) * f;
            p.vy += (dy / d) * f;
          }
          p.vx *= 0.9;
          p.vy *= 0.9;
          p.x += p.vx;
          p.y += p.vy;
          const sz = p.s * (1.75 + Math.sin(T * 2.4 + p.ph) * 0.28);
          g.drawImage(SPR[p.hi], p.x - sz, p.y - sz, sz * 2, sz * 2);
        }
        if (holding) {
          ch = Math.min(1, ch + 0.011);
          if (ch >= 1) hb.classList.add("full");
        }
        hb.style.setProperty("--p", ch * 100);
        for (let i = rk.length - 1; i >= 0; i--) {
          const r = rk[i];
          r.t += 0.022;
          const e = 1 - Math.pow(1 - r.t, 2);
          r.x = r.sx + (r.tx - r.sx) * e;
          r.y = H + (r.ty - H) * e;
          if (R() < 0.8)
            fx.push({
              x: r.x,
              y: r.y,
              px: r.x,
              py: r.y,
              vx: (R() - 0.5) * 0.5,
              vy: R() * 0.7,
              l: 0.5,
              h: 42,
              s: 1,
              g: 0.02,
              d: 0.99,
            });
          g.drawImage(SPR[3], r.x - 5, r.y - 5, 10, 10);
          if (r.t >= 1) {
            explode(r.x, r.y, r.h, r.type);
            rk.splice(i, 1);
          }
        }
        g.lineWidth = 1.9;
        g.lineCap = "round";
        for (const f of fx) {
          f.px = f.x;
          f.py = f.y;
          f.x += f.vx;
          f.y += f.vy;
          f.vy += f.g ?? 0.035;
          f.vx *= f.d ?? 0.985;
          f.vy *= f.d ?? 0.985;
          f.l -= 0.012;
          if (f.split && f.l < 0.74) {
            f.split = false;
            for (let k = 0; k < 8; k++) {
              const a = R() * TAU,
                v = 0.6 + R() * 1.7;
              fx.push({
                x: f.x,
                y: f.y,
                px: f.x,
                py: f.y,
                vx: Math.cos(a) * v,
                vy: Math.sin(a) * v,
                l: 0.85,
                h: f.h + 45,
                s: 1.15,
                g: 0.03,
                d: 0.99,
              });
            }
          }
          g.strokeStyle = `hsla(${f.h},100%,${64 + Math.sin(f.l * 26) * 6}%,${Math.max(f.l, 0)})`;
          g.lineWidth = (f.s || 1.8) * 0.95;
          g.beginPath();
          g.moveTo(f.x - f.vx * 2.4, f.y - f.vy * 2.4);
          g.lineTo(f.x, f.y);
          g.stroke();
        }
        fx = fx.filter((f) => f.l > 0);
        for (let i = waves.length - 1; i >= 0; i--) {
          const w = waves[i];
          w.r += 5.4;
          w.l -= 0.034;
          if (w.l <= 0) {
            waves.splice(i, 1);
            continue;
          }
          g.strokeStyle = `hsla(${w.h},100%,80%,${w.l * 0.42})`;
          g.lineWidth = 1.4 + w.l * 2.2;
          g.beginPath();
          g.arc(w.x, w.y, w.r, 0, TAU);
          g.stroke();
        }
        for (let i = flashes.length - 1; i >= 0; i--) {
          const f = flashes[i];
          f.l -= 0.075;
          if (f.l <= 0) {
            flashes.splice(i, 1);
            continue;
          }
          const rad = Math.min(W, H) * 0.14,
            fg = g.createRadialGradient(f.x, f.y, 0, f.x, f.y, rad);
          fg.addColorStop(0, `rgba(255,255,255,${0.26 * f.l})`);
          fg.addColorStop(0.5, `rgba(255,220,240,${0.09 * f.l})`);
          fg.addColorStop(1, "rgba(255,255,255,0)");
          g.fillStyle = fg;
          g.fillRect(f.x - rad, f.y - rad, rad * 2, rad * 2);
        }
        requestAnimationFrame(frame);
      }
      rs();
      frame();
    </script>
  </body>
</html>
